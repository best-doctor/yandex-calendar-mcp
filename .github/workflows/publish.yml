name: Publish

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs: {}

permissions:
  contents: read

jobs:
  publish:
    name: Публикация в PyPI
    runs-on: ubuntu-latest
    environment: pypi
    # id-token нужен для trusted publishing (OIDC): action использует его, когда секрет PYPI_API_TOKEN пуст
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Check version matches tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          uv run --frozen python - <<'PY'
          import os
          from yandex_calendar_mcp import __version__

          tag = os.environ['GITHUB_REF_NAME']
          expected = tag.removeprefix('v')
          if __version__ != expected:
              raise SystemExit(
                  f'Version mismatch: __init__.py has {__version__}, tag is {tag}. '
                  f'Set __version__ = "{expected}" before tagging.'
              )
          print(f'Version matched: {__version__}')
          PY

      - name: Install
        run: uv sync --frozen

      - name: Checks
        run: |
          uv run ruff check .
          uv run ruff format --check .
          uv run mypy
          uv run pytest -q

      - name: Build
        run: uv build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          password: ${{ secrets.PYPI_API_TOKEN }}
          skip-existing: true
