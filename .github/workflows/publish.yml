name: Publish

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs: {}

permissions:
  contents: read

jobs:
  publish:
    name: Публикация в PyPI
    runs-on: ubuntu-latest
    environment: pypi
    # id-token нужен для trusted publishing (OIDC): action использует его, когда секрет PYPI_API_TOKEN пуст
    permissions:
      contents: write  # создание GitHub Release
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Check version matches tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          uv run --frozen python - <<'PY'
          import os
          from yandex_calendar_mcp import __version__

          tag = os.environ['GITHUB_REF_NAME']
          expected = tag.removeprefix('v')
          if __version__ != expected:
              raise SystemExit(
                  f'Version mismatch: __init__.py has {__version__}, tag is {tag}. '
                  f'Set __version__ = "{expected}" before tagging.'
              )
          print(f'Version matched: {__version__}')
          PY

      - name: Install
        run: uv sync --frozen

      - name: Checks
        run: |
          uv run ruff check .
          uv run ruff format --check .
          uv run mypy
          uv run pytest -q

      - name: Build
        run: uv build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          password: ${{ secrets.PYPI_API_TOKEN }}
          skip-existing: true

      - name: Release notes from CHANGELOG
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          python - <<'PY'
          import os, re, pathlib
          version = os.environ['GITHUB_REF_NAME'].removeprefix('v')
          text = pathlib.Path('CHANGELOG.md').read_text(encoding='utf-8')
          match = re.search(rf'^## \[{re.escape(version)}\][^\n]*\n(.*?)(?=^## \[|^\[Unreleased\]:|\Z)', text, re.M | re.S)
          notes = match.group(1).strip() if match else f'Release {version}. Раздел в CHANGELOG.md не найден.'
          pathlib.Path('release-notes.md').write_text(notes + '\n', encoding='utf-8')
          print(notes)
          PY

      - name: GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "$GITHUB_REF_NAME" \
            --notes-file release-notes.md \
            --verify-tag
