name: CI

on:
  push:
    branches:
      - '**'
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Проверки (py${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.12', '3.13']
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true

      - name: Install
        run: uv sync --frozen

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format
        run: uv run ruff format --check .

      - name: Mypy
        run: uv run mypy

      - name: Tests
        run: uv run pytest -q

  build:
    name: Сборка пакета
    runs-on: ubuntu-latest
    needs: checks
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup uv
        uses: astral-sh/setup-uv@v7

      - name: Build
        run: uv build

      - name: Smoke-run entrypoints from the wheel
        run: |
          uv run --isolated --no-project --with dist/*.whl python - <<'PY'
          import importlib.metadata as m
          eps = {e.name for e in m.entry_points(group='console_scripts') if e.value.startswith('yandex_calendar_mcp')}
          assert eps == {'yandex-calendar-mcp', 'yandex-calendar-mcp-ro'}, eps
          print('entrypoints ok:', sorted(eps), 'version', m.version('yandex-calendar-mcp'))
          PY

      - name: Upload dist
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
