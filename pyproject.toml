[project]
name = "yandex-calendar-mcp"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "backoff==2.2.1",
    "caldav==3.4.0",
    "icalendar==7.3.0",
    "mcp==2.3.0",
    "pydantic==2.14.0",
    "pydantic-settings==2.15.0",
    "recurring-ical-events==3.8.2",
]

[project.scripts]
yandex-calendar-mcp = "yandex_calendar_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/yandex_calendar_mcp"]

[dependency-groups]
dev = [
    "mypy==2.4.0",
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "ruff==0.16.10",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "strict"

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "T20", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"scripts/*" = ["T20"]

[tool.ruff.format]
quote-style = "single"

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "scripts", "tests"]

[[tool.mypy.overrides]]
module = ["caldav", "caldav.*", "backoff", "icalendar", "recurring_ical_events"]
ignore_missing_imports = true
