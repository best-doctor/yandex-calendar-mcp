[project]
name = "yandex-calendar-mcp"
dynamic = ["version"]
description = "MCP server for Yandex Calendar over CalDAV: events, todos, attendee availability, readonly and write modes"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
authors = [
  { name = "Vladislav Katolyk", email = "v.katolyk@luchi.ru" },
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
keywords = ["mcp", "yandex", "calendar", "caldav"]
dependencies = [
    "backoff==2.2.1",
    "caldav==3.4.0",
    "icalendar==7.3.0",
    "mcp==2.3.0",
    "pydantic==2.14.0",
    "pydantic-settings==2.15.0",
    "recurring-ical-events==3.8.2",
]

[project.urls]
Homepage = "https://github.com/best-doctor/yandex-calendar-mcp"
Repository = "https://github.com/best-doctor/yandex-calendar-mcp"
Issues = "https://github.com/best-doctor/yandex-calendar-mcp/issues"

[project.scripts]
yandex-calendar-mcp = "yandex_calendar_mcp.server:main"
yandex-calendar-mcp-ro = "yandex_calendar_mcp.server:main_readonly"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/yandex_calendar_mcp/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/yandex_calendar_mcp"]

[tool.hatch.build.targets.sdist]
only-include = ["src/yandex_calendar_mcp", "README.md", "LICENSE", "pyproject.toml"]

[dependency-groups]
dev = [
    "mypy==2.4.0",
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "ruff==0.16.10",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "strict"

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "T20", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"scripts/*" = ["T20"]

[tool.ruff.format]
quote-style = "single"

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "scripts", "tests"]

[[tool.mypy.overrides]]
module = ["caldav", "caldav.*", "backoff", "icalendar", "recurring_ical_events"]
ignore_missing_imports = true
